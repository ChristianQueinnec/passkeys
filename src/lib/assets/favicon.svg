<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cartoonish Key -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="5" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g transform="rotate(45, 256, 256)" filter="url(#shadow)">
    <!-- Shaft -->
    <rect x="230" y="200" width="52" height="250" rx="10" fill="#FFC107" stroke="#4E342E" stroke-width="12"/>
    
    <!-- Teeth -->
    <rect x="230" y="320" width="100" height="40" rx="5" fill="#FFC107" stroke="#4E342E" stroke-width="12"/>
    <rect x="230" y="380" width="80" height="40" rx="5" fill="#FFC107" stroke="#4E342E" stroke-width="12"/>
    
    <!-- Head -->
    <circle cx="256" cy="150" r="90" fill="#FFC107" stroke="#4E342E" stroke-width="12"/>
    <circle cx="256" cy="150" r="30" fill="#FFF8E1" stroke="#4E342E" stroke-width="12"/>
    
    <!-- Cartoon Shine -->
    <path d="M210 110 Q 230 90 260 100" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
