networks:
  snipnet:
    external: true
    name: snipnet
# docker network create --subnet 172.55.0.0/16 snipnet

secrets:
  jwt_secret:
    file: ./jwt_secret.password

# .env should contain
# JWT_SECRET
# PASSKEYS=

services:
  passkeys:
    image: registry.queinnec.org:5000/passkeys:${PASSKEYS}
    container_name: passkeys
    hostname: passkeys.queinnec.org
    networks:
      snipnet:
        ipv4_address: 172.55.0.20
    expose:
      - "3000"
    volumes:
      - ./realdata:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    restart: unless-stopped
