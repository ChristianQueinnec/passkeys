services:
  passkeys:
    build:
      context: .
      args:
        - UID=1299
        - GID=1299
        - USER=queinnec
    image: registry.queinnec.org:5000/passkeys
    container_name: passkeys
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./realdata:/app/data
    restart: unless-stopped
