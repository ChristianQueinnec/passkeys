services:
  passkeys:
    image: registry.queinnec.org:5000/passkeys
    container_name: passkeys
    networks:
      trinvnet:
        ipv4_address: 172.55.0.20
    expose:
      - "3000"
    volumes:
      - ./realdata:/app/data
    restart: unless-stopped
